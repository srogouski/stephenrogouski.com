AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GitHub Actions OIDC provider + IAM role for the Cloud Resume Challenge CI/CD.
  Lets the GitHub repo deploy to AWS using short-lived credentials (no stored
  access keys).

Parameters:
  GitHubOrg:
    Type: String
    Default: srogouski
    Description: GitHub username or org that owns the repo.
  GitHubRepo:
    Type: String
    Default: cloud-resume-challenge
    Description: GitHub repository name.
  BranchName:
    Type: String
    Default: "*"
    Description: >
      Branch allowed to assume the deploy role. Use "*" to allow any ref in the
      repo (simplest to get working); narrow to e.g. "main" once confirmed.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        # GitHub's OIDC thumbprint; AWS now validates the cert chain so this is
        # effectively a formality, but the property is required.
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-cloud-resume-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # AWS requires the trust to be scoped on `sub` (or job_workflow_ref)
              # and not wildcard-to-all. This matches any ref/branch/environment in
              # this one repo, which is secure and satisfies that rule.
              StringLike:
                # This account/repo issue OIDC tokens with immutable numeric IDs
                # appended to the owner and repo (repo:owner@<id>/repo@<id>:...).
                # Wildcards absorb those IDs while still pinning owner + repo name.
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}*/${GitHubRepo}*:*"
      # Scoped permissions needed to deploy both stacks + sync the site.
      Policies:
        - PolicyName: cloud-resume-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormation
                Effect: Allow
                Action:
                  - cloudformation:*
                Resource: "*"
              - Sid: Lambda
                Effect: Allow
                Action:
                  - lambda:*
                Resource: "*"
              - Sid: ApiGateway
                Effect: Allow
                Action:
                  - apigateway:*
                Resource: "*"
              - Sid: DynamoDB
                Effect: Allow
                Action:
                  - dynamodb:*
                Resource: "*"
              - Sid: IamForServerless
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource: "*"
              - Sid: S3SiteAndSamArtifacts
                Effect: Allow
                Action:
                  - s3:*
                Resource: "*"
              - Sid: CloudFrontInvalidate
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetDistribution
                  - cloudfront:GetInvalidation
                  - cloudfront:UpdateDistribution
                  - cloudfront:ListDistributions
                Resource: "*"

Outputs:
  RoleArn:
    Description: "ARN of the role GitHub Actions assumes. Put this in the workflow."
    Value: !GetAtt GitHubActionsDeployRole.Arn
