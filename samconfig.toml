version = 0.1

[default.global.parameters]
stack_name = "cloud-resume-challenge"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-east-1"
# No `profile` here on purpose: CI (GitHub Actions) uses ambient OIDC credentials,
# and there is no named profile on the runner. Locally, pass `--profile administrator`
# on the command line when you need it.
